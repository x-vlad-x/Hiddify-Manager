name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-install:
    name: Ubuntu install (22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify detected Ubuntu release
        shell: bash
        run: |
          source common/utils.sh
          checkOS
          test "$(lsb_release -is)" = "Ubuntu"
          test "$(lsb_release -rs)" = "22.04"

      - name: Install project
        run: |
          sudo mkdir -p /opt/hiddify-manager
          sudo cp -r . /opt/hiddify-manager/
          cd /opt/hiddify-manager/
          sudo bash install.sh --no-gui

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hiddify-manager:test .

      - name: Smoke check image
        run: |
          docker run --rm --entrypoint bash hiddify-manager:test -lc '
            source /opt/hiddify-manager/common/utils.sh
            checkOS
            test -f /opt/hiddify-manager/install.sh
          '
