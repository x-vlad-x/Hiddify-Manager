name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-preflight:
    name: Ubuntu preflight (${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify detected Ubuntu release
        shell: bash
        run: |
          source common/utils.sh
          hiddify_detect_os
          test "${HIDDIFY_OS_ID}" = "ubuntu"
          test "${HIDDIFY_OS_VERSION_ID}" = "${{ matrix.ubuntu }}"
          test -n "${HIDDIFY_OS_VERSION_CODENAME}"

      - name: Run installer preflight
        run: sudo bash install.sh --preflight

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hiddify-manager:test .

      - name: Smoke check image
        run: |
          docker run --rm --entrypoint bash hiddify-manager:test -lc '
            source /opt/hiddify-manager/common/utils.sh
            checkOS
            hiddify_support_matrix
          '
